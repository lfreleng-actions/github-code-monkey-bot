---
# SPDX-License-Identifier: Apache-2.0
# SPDX-FileCopyrightText: 2026 The Linux Foundation

# Scheduled and on-demand entry point for the reusable workflow.
#
# The schedule runs two hours after the daily issues triage
# (github-issues-triage, 07:00 UTC weekdays) so Priority and Type are
# in place before selection. It stays in dry-run until the rollout
# in docs/DESIGN.md section 15 clears live operation; flip the
# `dry_run` expression below at that point. Disabling this workflow
# in the Actions UI is the kill switch.
name: 'Code Monkey ⏰'

# yamllint disable-line rule:truthy
on:
  schedule:
    - cron: '0 9 * * 1-5'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Run the agent but publish nothing'
        type: boolean
        default: true
      model:
        description: 'Model'
        type: choice
        options:
          - 'Claude Opus 5.5'
          - 'Claude Fable 5.1'
          - 'Claude Sonnet 5.5'
          - 'GPT-6 Astra'
        default: 'Claude Opus 5.5'
      mode:
        description: 'How far to take each issue'
        type: choice
        options:
          - 'select'
          - 'branches'
          - 'pull-requests'
        default: 'pull-requests'
      max_pull_requests:
        description: 'Pull requests to raise at most (0 = no cap)'
        type: string
        default: '10'
      max_runtime_minutes:
        description: 'Minutes each agent may run'
        type: string
        default: '180'
      max_concurrent_agents:
        description: 'Agents at once (1-30)'
        type: string
        default: '10'
      allow_subagents:
        description: 'Allow the agent to spawn sub-agents'
        type: boolean
        default: true
      include_dotgithub:
        description: 'Include issues from the .github repository'
        type: boolean
        default: false
      include_assigned:
        description: 'Include issues that already have an assignee'
        type: boolean
        default: false
      load_repo_skills:
        description: 'Trust skills found in the target checkout'
        type: boolean
        default: false
      request_review:
        description: 'Request and await a Copilot review of each pull request'
        type: boolean
        default: true
      repositories:
        description: 'Repositories to scan (commas and/or spaces)'
        type: string
        default: ''
      issues:
        description: >-
          Issues to work instead of scanning: repo#N, owner/repo#N,
          repo/issues/N or URLs (commas and/or spaces)
        type: string
        default: ''
      pull_requests:
        description: >-
          Open bot pull requests to revise: repo#N, owner/repo#N,
          repo/pull/N or URLs (commas and/or spaces)
        type: string
        default: ''
      revise:
        description: 'Revise open bot pull requests with work outstanding'
        type: boolean
        default: true
      categories:
        description: >-
          Issue categories to work: all, or any of bugs, features, docs,
          ci, code_quality, refactor, performance, other
        type: string
        default: 'all'

permissions: {}

# Serialise scheduled runs and scan dispatches of this caller. A group
# keeps one pending run and a newcomer cancels it, so this is not a
# FIFO queue. A dry dispatch writes nothing and takes a group of its
# own: it neither waits behind the schedule nor cancels a pending
# live run. A live dispatch that names `issues` or `pull_requests`
# locks on its own run, a fixed-length key: a group name built from
# the target lists would grow with them past GitHub's 400-character
# limit. Two dispatches naming the same or overlapping targets run
# apart; the reusable workflow's publish locks serialise their writes
# to any one pull request or issue, and the per-issue pull request
# check, the branch-exists refusal and the revision's compare-and-swap
# stop a duplicate.
concurrency:
  group: >-
    ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run
    && format('code-monkey-dry-run-{0}', github.run_id)
    || github.event_name == 'workflow_dispatch'
    && (inputs.issues != '' || inputs.pull_requests != '')
    && format('code-monkey-named-{0}', github.run_id)
    || 'code-monkey' }}
  cancel-in-progress: false

jobs:
  options:
    name: 'Resolve options'
    runs-on: 'ubuntu-latest'
    timeout-minutes: 2
    permissions: {}
    outputs:
      model: "${{ steps.map.outputs.id }}"
    steps:
      # Block mode needs the allow-list in this job too: the
      # environment variable does not cross job boundaries.
      - name: 'Load egress allow-list'
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/harden-runner-block-action@e5e8179f45aa893b23cc8b5d2e25466355d9c4f8 # v0.14.0
        with:
          # yamllint disable-line rule:line-length
          config: '@ac32415b91e0b6db1166bc451024c472cdbcbd3d'  # v0.16.8
          allow_list_summary: 'false'

      - name: 'Harden runner'
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: 'block'
          allowed-endpoints: "${{ env.CONNECTION_ALLOW_LIST }}"

      # Display names in the dispatch form map to the identifiers
      # docs/DESIGN.md section 10.3 checked against the CLI.
      - name: 'Map display name to identifier'
        id: map
        env:
          MODEL: "${{ inputs.model || 'Claude Opus 5.5' }}"
        run: |
          case "$MODEL" in
            'Claude Opus 5.5') id='claude-opus-5.5' ;;
            'Claude Fable 5.1') id='claude-fable-5.1' ;;
            'Claude Sonnet 5.5') id='claude-sonnet-5.5' ;;
            'GPT-6 Astra') id='gpt-6-astra' ;;
            *) echo "::error::Unknown model $MODEL"; exit 1 ;;
          esac
          echo "id=$id" >> "$GITHUB_OUTPUT"

  code-monkey:
    name: 'Code Monkey'
    needs: 'options'
    permissions:
      issues: read  # Candidate scan when running without the App
      contents: read  # Asset checkout and public repository reads
      actions: read  # Publish and report jobs locate artifacts
    uses: $/.github/workflows/code-monkey.yaml
    with:
      org: "${{ github.repository_owner }}"
      mode: "${{ inputs.mode || 'pull-requests' }}"
      # Scheduled runs stay dry-run until the rollout clears them.
      dry_run: >-
        ${{ github.event_name != 'workflow_dispatch' || inputs.dry_run }}
      model: "${{ needs.options.outputs.model }}"
      # A schedule passes no inputs; empty means every category, as
      # the reusable workflow's default does.
      categories: "${{ inputs.categories || 'all' }}"
      max_pull_requests: "${{ inputs.max_pull_requests || '10' }}"
      max_runtime_minutes: "${{ inputs.max_runtime_minutes || '180' }}"
      max_concurrent_agents: "${{ inputs.max_concurrent_agents || '10' }}"
      allow_subagents: >-
        ${{ github.event_name != 'workflow_dispatch'
            || inputs.allow_subagents }}
      include_dotgithub: ${{ inputs.include_dotgithub || false }}
      include_assigned: ${{ inputs.include_assigned || false }}
      load_repo_skills: ${{ inputs.load_repo_skills || false }}
      # A schedule passes no inputs; the review gate is on for it.
      request_review: >-
        ${{ github.event_name != 'workflow_dispatch'
            || inputs.request_review }}
      repositories: "${{ inputs.repositories || '' }}"
      issues: "${{ inputs.issues || '' }}"
      pull_requests: "${{ inputs.pull_requests || '' }}"
      # A schedule passes no inputs; it revises before working issues.
      revise: >-
        ${{ github.event_name != 'workflow_dispatch' || inputs.revise }}
      # Trusted jobs hold App tokens and run in block mode with the
      # organisation allow-list; the author job is always audit.
      egress_policy: 'block'
      # yamllint disable-line rule:line-length
      egress_allow_config: '@ac32415b91e0b6db1166bc451024c472cdbcbd3d'  # v0.16.8
      github_app_client_id: "${{ vars.BOT_APP_CLIENT_ID || '' }}"
      assets_repository: "${{ github.repository }}"
      assets_ref: "${{ github.sha }}"
    secrets:
      copilot_token: "${{ secrets.COPILOT_CLI_TOKEN }}"
      github_app_private_key: "${{ secrets.BOT_APP_PRIVATE_KEY }}"
