---
# SPDX-License-Identifier: Apache-2.0
# SPDX-FileCopyrightText: 2026 The Linux Foundation

# Reusable workflow: select open issues, run one Copilot CLI coding
# agent per repository against a checkout, and publish the result as
# GitHub-signed commits and a pull request through a trusted job.
#
# Trust boundary (docs/DESIGN.md sections 4, 5, 8): the author job
# holds no repository write credential and never sees the App key.
# It emits a git bundle and a manifest; the publish job treats both
# as hostile input, verifies them offline, and makes every write with
# a per-repository App token.
name: 'Code Monkey'

# yamllint disable-line rule:truthy
on:
  workflow_call:
    inputs:
      org:
        description: 'Target owner; live runs require an organisation App'
        required: true
        type: string
      mode:
        description: 'select, branches, or pull-requests'
        type: string
        default: 'pull-requests'
      dry_run:
        description: 'Run the agent; publish nothing'
        type: boolean
        default: true
      model:
        description: 'Copilot CLI model identifier'
        type: string
        default: 'claude-opus-5.5'
      max_pull_requests:
        description: 'Pull requests to raise at most; 0 lifts the cap'
        type: string
        default: '10'
      categories:
        description: >-
          Issue categories to work: all, or a list of bugs, features,
          docs, ci, code_quality, refactor, performance, other
        type: string
        default: 'all'
      max_runtime_minutes:
        description: 'Wall-clock budget for each agent session'
        type: string
        default: '180'
      max_concurrent_agents:
        description: 'Agents running at once (1-30)'
        type: string
        default: '10'
      allow_subagents:
        description: 'Let the agent spawn sub-agents'
        type: boolean
        default: true
      include_dotgithub:
        description: 'Consider issues in the .github repository'
        type: boolean
        default: false
      include_assigned:
        description: 'Consider issues that have an assignee'
        type: boolean
        default: false
      load_repo_skills:
        description: 'Let the agent use skills from the target checkout'
        type: boolean
        default: false
      request_review:
        description: >-
          Request a Copilot review of each pull request opened, wait for
          it and report its verdict
        type: boolean
        default: true
      repositories:
        description: 'Repositories to scan; commas and/or spaces'
        type: string
        default: ''
      issues:
        description: >-
          Issues to work instead of scanning: repo#N, owner/repo#N,
          repo/issues/N or URLs; commas and/or spaces
        type: string
        default: ''
      pull_requests:
        description: >-
          Open bot pull requests to revise: repo#N, owner/repo#N,
          repo/pull/N or URLs; commas and/or spaces
        type: string
        default: ''
      revise:
        description: >-
          Revise open bot pull requests with review findings or new
          maintainer comments, before working new issues
        type: boolean
        default: true
      exclude_repos:
        description: 'Repos to skip, commas and/or spaces; overrides bundle'
        type: string
        default: ''
      guidance_repository:
        description: 'Repository holding the organisation AGENTS.md'
        type: string
        default: ''
      guidance_ref:
        description: 'Branch or tag of the guidance to record and use'
        type: string
        default: 'main'
      egress_policy:
        description: 'harden-runner egress for trusted jobs: audit or block'
        type: string
        default: 'block'
      egress_allow_config:
        description: 'harden-runner-block-action config coordinate'
        type: string
        default: ''
      github_app_client_id:
        description: 'GitHub App client id; empty limits runs to dry-run'
        type: string
        default: ''
      assets_repository:
        description: 'Trusted repository providing the prompt and scripts'
        type: string
        default: 'lfreleng-actions/github-code-monkey-bot'
      assets_ref:
        description: >-
          Commit, tag or branch of the assets; empty resolves the
          calling workflow's own commit
        type: string
        default: ''
    secrets:
      copilot_token:
        description: >-
          Personal fine-grained PAT with Copilot Requests and no
          repository grants; the only credential the agent receives
        required: false
      github_app_private_key:
        description: 'GitHub App private key, used in trusted jobs alone'
        required: false

permissions: {}

# Live scans hold one lock per caller repository and owner across the
# whole pipeline; different caller repositories need external
# coordination if they target the same estate. A group keeps one
# pending run and a newcomer cancels it, so dry runs, which write
# nothing, lock within their own caller run and never cancel or wait
# on a live run or another caller run's dry run. Live runs that name
# `issues` lock within their own caller run the same way: their scope
# is those issues alone, and the per-issue pull request check and
# branch-exists refusal stop a duplicate.
concurrency:
  group: >-
    ${{ inputs.dry_run
    && format('code-monkey-dry-run-{0}-{1}', github.run_id, inputs.org)
    || inputs.issues != ''
    && format('code-monkey-named-{0}-{1}', github.run_id, inputs.org)
    || format('code-monkey-{0}-{1}', github.repository, inputs.org) }}
  cancel-in-progress: false

env:
  COPILOT_CLI_VERSION: '1.0.83'

jobs:
  select:
    name: 'Select'
    runs-on: 'ubuntu-latest'
    timeout-minutes: 20
    permissions:
      issues: read  # Candidate scan without an App (dry-run plumbing)
      contents: read  # Checkout trusted assets; read public repositories
      actions: read  # Read this run's creation time for comment markers
    outputs:
      assets_sha: "${{ steps.pinned.outputs.sha }}"
      run_created_at: "${{ steps.identity.outputs.created_at }}"
      namespace: "${{ steps.identity.outputs.namespace }}"
      evidence_id: "${{ steps.evidence.outputs.artifact-id }}"
      selection_sha256: "${{ steps.digests.outputs.selection }}"
      guidance_sha256: "${{ steps.digests.outputs.guidance }}"
      count: "${{ steps.chosen.outputs.count }}"
      matrix: "${{ steps.chosen.outputs.matrix }}"
      run_agent: "${{ steps.chosen.outputs.run_agent }}"
      author_timeout: "${{ steps.budget.outputs.author_timeout }}"
      agent_timeout: "${{ steps.budget.outputs.agent_timeout }}"
      max_parallel: "${{ steps.budget.outputs.max_parallel }}"
    steps:
      - name: 'Load egress allow-list'
        if: inputs.egress_policy == 'block'
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/harden-runner-block-action@51ef68401547a8b648275129b9a21544612596d5 # v0.13.1
        with:
          config: "${{ inputs.egress_allow_config }}"
          allow_list_summary: 'true'

      - name: 'Harden runner'
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: "${{ inputs.egress_policy }}"
          allowed-endpoints: "${{ env.CONNECTION_ALLOW_LIST }}"

      - name: 'Allocate invocation identity'
        id: identity
        env:
          RUN_ID: "${{ github.run_id }}"
          RUN_ATTEMPT: "${{ github.run_attempt }}"
          GH_TOKEN: "${{ github.token }}"
          REPOSITORY: "${{ github.repository }}"
        run: |
          python3 - <<'PY'
          import os, uuid
          run = os.environ['RUN_ID']
          attempt = os.environ['RUN_ATTEMPT']
          namespace = f"{run}-{attempt}-{uuid.uuid4().hex}"
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'namespace={namespace}\n')
          PY
          # The run's creation time is the same for every attempt, so
          # it bounds the search for this run's own earlier comments
          # even after a full rerun regenerates the selection.
          created="$(gh api "repos/$REPOSITORY/actions/runs/$RUN_ID" \
            --jq .created_at)"
          [[ "$created" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9:]{8}Z$ ]]
          echo "created_at=$created" >> "$GITHUB_OUTPUT"

      # Operator lists: commas, spaces or newlines between items of
      # the target owner. Each splits offline, with no token, and a
      # bad item fails the run before the App key is used, every
      # mistake reported at once. Repeats collapse without regard to
      # case, as GitHub compares repository names; an issue publishes
      # as owner/repo#N whichever of the accepted spellings named it.
      - name: 'Split repositories'
        id: repositories
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/list-splitter-action@b56a625474875d05ca8d1c1eb3314c29c526c9a6 # v0.1.0
        with:
          list: "${{ inputs.repositories }}"
          validate: 'repository'
          owner: "${{ inputs.org }}"
          token: ''

      - name: 'Split excluded repositories'
        id: exclusions
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/list-splitter-action@b56a625474875d05ca8d1c1eb3314c29c526c9a6 # v0.1.0
        with:
          list: "${{ inputs.exclude_repos }}"
          validate: 'repository'
          owner: "${{ inputs.org }}"
          token: ''

      - name: 'Split issues'
        id: issues
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/list-splitter-action@b56a625474875d05ca8d1c1eb3314c29c526c9a6 # v0.1.0
        with:
          list: "${{ inputs.issues }}"
          validate: 'issue'
          owner: "${{ inputs.org }}"
          token: ''

      - name: 'Split pull requests'
        id: pulls
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/list-splitter-action@b56a625474875d05ca8d1c1eb3314c29c526c9a6 # v0.1.0
        with:
          list: "${{ inputs.pull_requests }}"
          validate: 'pull-request'
          owner: "${{ inputs.org }}"
          token: ''

      # The token action finds the installation through the first
      # repository in its scope, so an absent name there fails the mint
      # before selection could say so. Public repositories answer the
      # native token, and so does this private caller repository where
      # the App may not be installed, so the read must also say the
      # repository is public. A named issue's repository that fails
      # that leaves the scope here and the selector then records the
      # issue as skipped. A scan repository that fails it is an error
      # either way; this names it plainly.
      - name: 'Resolve named repositories'
        id: named
        env:
          GH_TOKEN: "${{ github.token }}"
          ORG: "${{ inputs.org }}"
          ISSUE_REPOSITORIES: "${{ steps.issues.outputs.repositories }}"
          PULL_REPOSITORIES: "${{ steps.pulls.outputs.repositories }}"
          REPOSITORIES: "${{ steps.repositories.outputs.repositories }}"
        run: |
          # Whether the repository exists and is public; 2 on any
          # other failure.
          usable() {
            local output status
            set +e
            output="$(gh api "repos/$ORG/$1" --jq .private 2>&1)"
            status=$?
            set -e
            if [ "$status" -eq 0 ]; then
              [ "$output" = false ] && return 0
              return 1
            fi
            if grep -q 'HTTP 404' <<< "$output"; then return 1; fi
            echo "::error::Could not read $ORG/$1: $output"
            exit 2
          }
          IFS=, read -ra scan <<< "$REPOSITORIES"
          for name in "${scan[@]}"; do
            [ -n "$name" ] || continue
            usable "$name" || {
              echo "::error::repository $ORG/$name not found or not public"
              exit 1; }
          done
          # Named issues and named pull requests share one scope.
          IFS=, read -ra named <<< "$ISSUE_REPOSITORIES,$PULL_REPOSITORIES"
          kept=()
          for name in "${named[@]}"; do
            [ -n "$name" ] || continue
            case ",${kept[*]:-}," in *",$name,"*) continue ;; esac
            if usable "$name"; then kept+=("$name"); fi
          done
          if [ -n "$ISSUE_REPOSITORIES$PULL_REPOSITORIES" ] &&
            [ "${#kept[@]}" -eq 0 ]; then
            echo "::error::none of the named issues' repositories exist" \
              "as public repositories in $ORG:" \
              "$ISSUE_REPOSITORIES $PULL_REPOSITORIES"
            exit 1
          fi
          joined=''
          for name in "${kept[@]}"; do joined="${joined:+$joined,}$name"; done
          echo "repositories=$joined" >> "$GITHUB_OUTPUT"

      - name: 'Check inputs'
        id: budget
        env:
          MODE: "${{ inputs.mode }}"
          MAX_PRS: "${{ inputs.max_pull_requests }}"
          MAX_RUNTIME: "${{ inputs.max_runtime_minutes }}"
          MAX_AGENTS: "${{ inputs.max_concurrent_agents }}"
          MODEL: "${{ inputs.model }}"
          # Already split, checked and comma-joined, as the App token
          # action takes it; empty keeps the read token organisation-wide,
          # which the scan needs. Named issues scope it to their own
          # repositories instead.
          REPOSITORIES: "${{ steps.repositories.outputs.repositories }}"
          REPOSITORY_COUNT: "${{ steps.repositories.outputs.count }}"
          ISSUE_REPOSITORIES: "${{ steps.named.outputs.repositories }}"
          ISSUE_COUNT: "${{ steps.issues.outputs.count }}"
          PULL_COUNT: "${{ steps.pulls.outputs.count }}"
          # The raw lists, only to tell an absent list from one that
          # parsed to nothing.
          ISSUES_RAW: "${{ inputs.issues }}"
          REPOSITORIES_RAW: "${{ inputs.repositories }}"
          ORG: "${{ inputs.org }}"
          # yamllint disable-line rule:line-length
          GUIDANCE_REPOSITORY: "${{ inputs.guidance_repository || format('{0}/.github', inputs.org) }}"
        run: |
          case "$MODE" in
            select|branches|pull-requests) ;;
            *) echo "::error::mode must be select, branches or pull-requests"
               exit 1 ;;
          esac
          [[ "$MAX_PRS" =~ ^[0-9]+$ ]] || {
            echo '::error::max_pull_requests must be a non-negative integer'
            exit 1; }
          [[ "$MAX_RUNTIME" =~ ^[1-9][0-9]*$ ]] && [ "$MAX_RUNTIME" -le 330 ] ||
            { echo '::error::max_runtime_minutes must be 1-330'; exit 1; }
          [[ "$MAX_AGENTS" =~ ^[1-9][0-9]*$ ]] && [ "$MAX_AGENTS" -le 30 ] || {
            echo '::error::max_concurrent_agents must be 1-30'; exit 1; }
          [[ "$MODEL" =~ ^[a-z0-9.-]+$ ]] || {
            echo '::error::model must be a lower-case identifier'; exit 1; }
          # Expressions cannot add, so the job budget (session plus
          # toolchain setup and upload) is computed here.
          #
          # Only an empty list means "scan". The concurrency group tests
          # the raw issues input, while selection sees the split one, so
          # a list of separators alone would take a per-run lock and
          # then scan; it fails here, before selection and the mint. An
          # issues list may name pull requests, which count beside the
          # issues here. Issues and repositories exclude each other.
          if [ -n "$ISSUES_RAW" ] && [ "$ISSUE_COUNT" = 0 ] &&
            [ "${PULL_COUNT:-0}" = 0 ]; then
            echo '::error::issues was given but names no issue'
            exit 1
          fi
          if [ -n "$REPOSITORIES_RAW" ] && [ "$REPOSITORY_COUNT" = 0 ]; then
            echo '::error::repositories was given but names no repository'
            exit 1
          fi
          if { [ "$ISSUE_COUNT" != 0 ] || [ "$PULL_COUNT" != 0 ]; } &&
            [ "$REPOSITORY_COUNT" != 0 ]; then
            echo '::error::issues and repositories cannot both be given'
            echo '::error::(named pull requests count as issues here)'
            exit 1
          fi
          repositories="${ISSUE_REPOSITORIES:-$REPOSITORIES}"
          # A scoped token must still reach the guidance repository
          # when it lives in the same organisation.
          guidance_owner="${GUIDANCE_REPOSITORY%%/*}"
          guidance_name="${GUIDANCE_REPOSITORY#*/}"
          if [ -n "$repositories" ] && [ "$guidance_owner" = "$ORG" ]; then
            case ",$repositories," in
              *",$guidance_name,"*) ;;
              *) repositories="$repositories,$guidance_name" ;;
            esac
          fi
          {
            echo "agent_timeout=$MAX_RUNTIME"
            echo "author_timeout=$((MAX_RUNTIME + 20))"
            echo "max_parallel=$MAX_AGENTS"
            echo "repositories=$repositories"
          } >> "$GITHUB_OUTPUT"

      - name: 'Require App for live runs'
        # yamllint disable-line rule:line-length
        if: ${{ !inputs.dry_run && inputs.mode != 'select' && inputs.github_app_client_id == '' }}
        run: |
          echo '::error::Live runs require organisation App credentials'
          exit 1

      - name: 'Resolve assets ref'
        id: assets
        env:
          ASSETS_REF: "${{ inputs.assets_ref }}"
          # yamllint disable-line rule:line-length
          JOB_WORKFLOW_SHA: "${{ job.workflow_sha || github.job_workflow_sha }}"
        run: |
          ref="${ASSETS_REF:-$JOB_WORKFLOW_SHA}"
          if [ -z "$ref" ]; then
            echo '::error::Cannot resolve workflow commit; set assets_ref'
            exit 1
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      - name: 'Checkout trusted assets'
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: "${{ inputs.assets_repository }}"
          ref: "${{ steps.assets.outputs.ref }}"
          path: 'monkey-assets'
          persist-credentials: false

      - name: 'Pin assets commit'
        id: pinned
        run: |
          sha="$(git -C monkey-assets rev-parse HEAD)"
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      # Pre-flight gate (docs/DESIGN.md section 4.4). The contract tests
      # and zizmor run again here, from the pinned assets, so a drift
      # merged into the workflow fails this run before any token exists.
      # The config check reads the credential shapes from the
      # environment and prints nothing it read.
      - name: 'Set up uv'
        # yamllint disable-line rule:line-length
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: false

      - name: 'Install zizmor'
        run: uv tool install 'zizmor==1.30.1'

      - name: 'Pre-flight: workflow contracts and audit'
        run: |
          cd monkey-assets
          uv run --locked python -B scripts/preflight.py workflow --root .

      - name: 'Pre-flight: configuration and credentials'
        env:
          BOT_APP_CLIENT_ID: "${{ inputs.github_app_client_id }}"
          BOT_APP_PRIVATE_KEY: "${{ secrets.github_app_private_key }}"
          COPILOT_GITHUB_TOKEN: "${{ secrets.copilot_token }}"
          EGRESS_POLICY: "${{ inputs.egress_policy }}"
          EGRESS_ALLOW_CONFIG: "${{ inputs.egress_allow_config }}"
          DRY_RUN: "${{ inputs.dry_run }}"
          # yamllint disable-line rule:line-length
          JOB_WORKFLOW_SHA: "${{ job.workflow_sha || github.job_workflow_sha }}"
          ASSETS_SHA: "${{ steps.pinned.outputs.sha }}"
        run: |
          extra=()
          if [ "$DRY_RUN" = true ]; then extra+=(--dry-run); fi
          python3 monkey-assets/scripts/preflight.py config \
            --config monkey-assets/config/bot.json \
            --egress-policy "$EGRESS_POLICY" \
            --egress-allow-config "$EGRESS_ALLOW_CONFIG" \
            --workflow-sha "$JOB_WORKFLOW_SHA" \
            --assets-sha "$ASSETS_SHA" "${extra[@]}"
          python3 monkey-assets/scripts/fork_orgs.py check \
            --config monkey-assets/config/fork-orgs.json

      - name: 'Mint read-only App token'
        id: app-token
        if: inputs.github_app_client_id != ''
        # yamllint disable-line rule:line-length
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        # v3.2.0 forwards INPUT_PERMISSION-* but does not declare
        # these org grants; env avoids main/post input warnings.
        env:
          INPUT_PERMISSION-ISSUE-FIELDS: 'read'
          INPUT_PERMISSION-ISSUE-TYPES: 'read'
        with:
          client-id: "${{ inputs.github_app_client_id }}"
          private-key: "${{ secrets.github_app_private_key }}"
          owner: "${{ inputs.org }}"
          # Empty means every repository of the owner: the candidate
          # scan is organisation-wide by design and this token reads.
          repositories: "${{ steps.budget.outputs.repositories }}"
          permission-issues: 'read'
          permission-metadata: 'read'
          permission-contents: 'read'
          permission-pull-requests: 'read'

      # The slug the mint returns is the one signal that says whose key
      # was wired in; a probe with the token proves it cannot write.
      - name: 'Pre-flight: App identity and token grants'
        if: inputs.github_app_client_id != ''
        env:
          GH_TOKEN: "${{ steps.app-token.outputs.token }}"
          MINTED_SLUG: "${{ steps.app-token.outputs.app-slug }}"
          REPOSITORY: "${{ github.repository }}"
        run: |
          python3 monkey-assets/scripts/preflight.py identity \
            --config monkey-assets/config/bot.json --minted-slug "$MINTED_SLUG"
          python3 monkey-assets/scripts/preflight.py token \
            --repository "$REPOSITORY"

      - name: 'Select issues'
        env:
          GH_TOKEN: "${{ steps.app-token.outputs.token || github.token }}"
          ORG: "${{ inputs.org }}"
          MODE: "${{ inputs.mode }}"
          MODEL: "${{ inputs.model }}"
          DRY_RUN: "${{ inputs.dry_run }}"
          REPOSITORIES: "${{ steps.repositories.outputs.csv }}"
          ISSUES: "${{ steps.issues.outputs.csv }}"
          PULL_REQUESTS: "${{ steps.pulls.outputs.csv }}"
          REVISE: "${{ inputs.revise }}"
          EXCLUDE_REPOS: "${{ steps.exclusions.outputs.csv }}"
          INCLUDE_DOTGITHUB: "${{ inputs.include_dotgithub }}"
          INCLUDE_ASSIGNED: "${{ inputs.include_assigned }}"
          MAX_PRS: "${{ inputs.max_pull_requests }}"
          CATEGORIES: "${{ inputs.categories }}"
          # yamllint disable-line rule:line-length
          GUIDANCE_REPOSITORY: "${{ inputs.guidance_repository || format('{0}/.github', inputs.org) }}"
          GUIDANCE_REF: "${{ inputs.guidance_ref }}"
          BOT_SLUG: "${{ steps.app-token.outputs.app-slug }}"
        run: |
          extra=()
          if [ "$DRY_RUN" = true ]; then extra+=(--dry-run); fi
          if [ "$INCLUDE_DOTGITHUB" = true ]; then
            extra+=(--include-dotgithub)
          fi
          if [ "$INCLUDE_ASSIGNED" = true ]; then
            extra+=(--include-assigned)
          fi
          if [ "$REVISE" != true ]; then
            extra+=(--no-revise)
          fi
          python3 monkey-assets/scripts/select_issues.py \
            --org "$ORG" --output-dir artefacts \
            --mode "$MODE" --model "$MODEL" \
            --repositories "$REPOSITORIES" \
            --issues "$ISSUES" \
            --pull-requests "$PULL_REQUESTS" \
            --exclude-file monkey-assets/config/excluded-repos.txt \
            --exclude-repos "$EXCLUDE_REPOS" \
            --fork-orgs monkey-assets/config/fork-orgs.json \
            --max-pull-requests "$MAX_PRS" \
            --categories "$CATEGORIES" \
            --guidance-repository "$GUIDANCE_REPOSITORY" \
            --guidance-ref "$GUIDANCE_REF" \
            --bot-slug "$BOT_SLUG" "${extra[@]}"
          cat artefacts/selection-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: 'Publish selection outputs'
        id: chosen
        env:
          MODE: "${{ inputs.mode }}"
        run: |
          count="$(jq '.include | length' artefacts/matrix.json)"
          [[ "$count" =~ ^[0-9]+$ ]]
          run_agent=false
          if [ "$MODE" != select ] && [ "$count" != 0 ]; then
            run_agent=true
          fi
          {
            echo "count=$count"
            echo "run_agent=$run_agent"
            echo "matrix=$(jq -c . artefacts/matrix.json)"
          } >> "$GITHUB_OUTPUT"

      - name: 'Record evidence digests'
        id: digests
        run: |
          python3 - <<'PY'
          import hashlib, os, pathlib
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              for name, path in (('selection', 'selection.json'),
                                 ('guidance', 'agents.md')):
                  content = pathlib.Path('artefacts', path).read_bytes()
                  output.write(f'{name}={hashlib.sha256(content).hexdigest()}\n')
          PY

      # Artifact IDs and file digests come from this trusted job.
      # An artifact name alone is not an integrity boundary.
      - name: 'Publish selection evidence'
        id: evidence
        # yamllint disable-line rule:line-length
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: "monkey-evidence-${{ steps.identity.outputs.namespace }}"
          path: 'artefacts/'
          retention-days: 7
          if-no-files-found: 'error'

  author:
    name: 'Author (${{ matrix.key }})'
    needs: 'select'
    if: needs.select.outputs.run_agent == 'true'
    runs-on: 'ubuntu-latest'
    # Session budget plus toolchain setup and artifact upload.
    timeout-minutes: ${{ fromJSON(needs.select.outputs.author_timeout) }}
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(needs.select.outputs.max_parallel) }}
      matrix: ${{ fromJSON(needs.select.outputs.matrix) }}
    permissions:
      contents: read  # Checkout assets and the public target repository
    steps:
      # Always audit: the agent installs whatever toolchain the target
      # repository's hooks pin, which no fixed allow-list can cover.
      - name: 'Harden runner (audit)'
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: 'audit'

      - name: 'Require pinned assets'
        env:
          ASSETS_SHA: "${{ needs.select.outputs.assets_sha }}"
          BASE_SHA: "${{ matrix.base_sha }}"
          CHECKOUT_SHA: "${{ matrix.checkout_sha }}"
          HEAD_SHA: "${{ matrix.head_sha }}"
          TASK: "${{ matrix.task }}"
          KEY: "${{ matrix.key }}"
        run: |
          [[ "$ASSETS_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$CHECKOUT_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$HEAD_SHA" =~ ^([0-9a-f]{40})?$ ]]
          [[ "$TASK" =~ ^(issue|revise)$ ]]
          [[ "$KEY" =~ ^[A-Za-z0-9_.-]+$ ]]

      - name: 'Checkout prompt assets'
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: "${{ inputs.assets_repository }}"
          ref: "${{ needs.select.outputs.assets_sha }}"
          path: 'monkey-assets'
          persist-credentials: false

      - name: 'Fetch selection evidence'
        # yamllint disable-line rule:line-length
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: "${{ needs.select.outputs.evidence_id }}"
          merge-multiple: true
          path: 'evidence'

      - name: 'Verify evidence bytes'
        env:
          SELECTION_SHA: "${{ needs.select.outputs.selection_sha256 }}"
          GUIDANCE_SHA: "${{ needs.select.outputs.guidance_sha256 }}"
        run: |
          python3 monkey-assets/scripts/bot_evidence.py verify \
            --directory evidence --expect "selection.json=$SELECTION_SHA" \
            --expect "agents.md=$GUIDANCE_SHA"

      # The default token has no grant on the target repository; the
      # checkout succeeds because the estate is public. Nothing here
      # can push (docs/DESIGN.md section 4.1). An issue checks out its
      # base; a revision checks out the default branch head, so the
      # agent can rebase onto it (docs/DESIGN.md section 20).
      - name: 'Checkout target repository'
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: "${{ matrix.repository }}"
          ref: "${{ matrix.checkout_sha }}"
          path: 'workspace'
          fetch-depth: 0
          persist-credentials: false

      # The bot branch lives in a public fork, so it fetches without a
      # credential. The head must be the one the selection recorded:
      # a branch that moved since is not the work this round was
      # chosen for, and the publisher would refuse the result anyway.
      - name: 'Fetch pull request branch'
        if: matrix.task == 'revise'
        env:
          FORK_REPOSITORY: "${{ matrix.fork_repository }}"
          BRANCH: "${{ matrix.branch }}"
          HEAD_SHA: "${{ matrix.head_sha }}"
        run: |
          git -C workspace fetch -q "https://github.com/$FORK_REPOSITORY.git" \
            "refs/heads/$BRANCH"
          [ "$(git -C workspace rev-parse FETCH_HEAD)" = "$HEAD_SHA" ] || {
            echo "::error::$BRANCH in $FORK_REPOSITORY is not at $HEAD_SHA"
            exit 1; }
          git -C workspace branch -q "$BRANCH" "$HEAD_SHA"
          git -C workspace switch -q "$BRANCH"

      - name: 'Set up Node.js'
        # yamllint disable-line rule:line-length
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          package-manager-cache: false

      - name: 'Set up uv'
        # yamllint disable-line rule:line-length
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: false

      - name: 'Install agent toolchain'
        run: |  # zizmor: ignore[adhoc-packages] exact versions pinned
          npm install -g "@github/copilot@$COPILOT_CLI_VERSION" 'aislop@0.14.1'
          uv tool install 'prek==0.4.10'

      - name: 'Prepare workspace and packet'
        id: packet
        env:
          KEY: "${{ matrix.key }}"
          TASK: "${{ matrix.task }}"
          CHECKOUT_SHA: "${{ matrix.checkout_sha }}"
          HEAD_SHA: "${{ matrix.head_sha }}"
        run: |
          mkdir -p artefacts
          jq -e --arg key "$KEY" '.issues[] | select(.key == $key)' \
            evidence/selection.json > artefacts/issue.json
          # A placeholder, not the App: the publisher replaces every
          # *-by trailer, and the bot's own sign-off is too long for a
          # target .gitlint without the trailer exemption (DESIGN.md 7.1).
          git_name='Code Monkey'
          git_email='code-monkey@example.invalid'
          git -C workspace config user.name "$git_name"
          git -C workspace config user.email "$git_email"
          git -C workspace config commit.gpgsign false
          expected="$CHECKOUT_SHA"
          if [ "$TASK" = revise ]; then expected="$HEAD_SHA"; fi
          [ "$(git -C workspace rev-parse HEAD)" = "$expected" ]
          {
            echo "git_identity=$git_name <$git_email>"
            echo "branch=$(jq -r '.branch' artefacts/issue.json)"
            echo "repository=$(jq -r '.repository' artefacts/issue.json)"
          } >> "$GITHUB_OUTPUT"

      - name: 'Assemble prompt'
        env:
          REPOSITORY: "${{ steps.packet.outputs.repository }}"
          BRANCH: "${{ steps.packet.outputs.branch }}"
          BASE_SHA: "${{ matrix.base_sha }}"
          REBASE_SHA: "${{ matrix.rebase_sha }}"
          HEAD_SHA: "${{ matrix.head_sha }}"
          PULL_NUMBER: "${{ matrix.pull_number }}"
          TASK: "${{ matrix.task }}"
          GIT_IDENTITY: "${{ steps.packet.outputs.git_identity }}"
          MODE: "${{ inputs.mode }}"
        run: |
          artefacts="$(pwd)/artefacts"
          cp evidence/agents.md "$artefacts/agents.md"
          local_stub='absent'
          if [ -f workspace/AGENTS.md ]; then
            local_stub='present: AGENTS.md'
          fi
          # shellcheck disable=SC2016  # literal backticks for markdown
          {
            cat monkey-assets/prompt/"$TASK".md
            printf '\n## Runtime context\n\n'
            printf -- '- repository: `%s`\n' "$REPOSITORY"
            printf -- '- base_sha: `%s`\n' "$BASE_SHA"
            if [ "$TASK" = revise ]; then
              printf -- '- rebase_sha: `%s`\n' "$REBASE_SHA"
              printf -- '- pull request: #%s, head `%s`\n' \
                "$PULL_NUMBER" "$HEAD_SHA"
            fi
            printf -- '- branch: `%s`\n' "$BRANCH"
            printf -- '- git identity: `%s` (placeholder, set in git)\n' \
              "$GIT_IDENTITY"
            printf -- '- mode: `%s`\n' "$MODE"
            printf -- '- issue packet: `%s/issue.json`\n' "$artefacts"
            printf -- '- organisation guidance: `%s/agents.md`\n' "$artefacts"
            printf -- '- repository AGENTS.md: %s\n' "$local_stub"
            printf -- '- artefacts directory (write manifest.json here):'
            printf -- ' `%s`\n' "$artefacts"
          } > artefacts/prompt.md

      - name: 'Run coding agent (Copilot)'
        id: agent
        timeout-minutes: ${{ fromJSON(needs.select.outputs.agent_timeout) }}
        env:
          COPILOT_GITHUB_TOKEN: "${{ secrets.copilot_token }}"
          COPILOT_HOME: "${{ runner.temp }}/copilot"
          MODEL: "${{ inputs.model }}"
          ALLOW_SUBAGENTS: "${{ inputs.allow_subagents }}"
          LOAD_REPO_SKILLS: "${{ inputs.load_repo_skills }}"
        run: |
          # The prefix rejects native/classic tokens, not extra PAT
          # grants. The caller must provision Copilot Requests only.
          case "$COPILOT_GITHUB_TOKEN" in
            github_pat_*) ;;
            *)
              echo '::error::Use a model-only fine-grained Copilot PAT'
              exit 1 ;;
          esac
          artefacts="$(pwd)/artefacts"
          mkdir -p "$artefacts/copilot-logs"
          prompt="$(cat "$artefacts/prompt.md")"
          # gh is denied because the agent has nothing to authenticate
          # with and a failing call reads to the model like a bug to
          # route around. Everything else the agent needs -- git, the
          # write tool, interpreters -- is a bypass of shell-level
          # denials anyway (docs/DESIGN.md 4.1); containment is the
          # missing credential, not this list.
          deny='shell(gh),shell(gh:*),shell(git push),shell(git push:*)'
          if [ "$ALLOW_SUBAGENTS" != true ]; then
            deny="$deny,task,list_agents,read_agent,write_agent"
          fi
          if [ "$LOAD_REPO_SKILLS" != true ]; then
            deny="$deny,skill"
          fi
          cd workspace
          copilot \
            --prompt="$prompt" \
            --model="$MODEL" \
            --mode autopilot \
            --allow-all-tools \
            --deny-tool="$deny" \
            --add-dir "$artefacts" \
            --secret-env-vars=COPILOT_GITHUB_TOKEN \
            --no-ask-user --no-custom-instructions --disable-builtin-mcps \
            --no-auto-update --no-color \
            --log-dir="$artefacts/copilot-logs" \
            --usage-output-file "$artefacts/usage.json" \
            --share="$artefacts/session-summary.md"

      # The workflow, not the agent, turns the branch into a bundle and
      # supplies a manifest when the agent left none, so the publisher
      # always has something typed to report on.
      - name: 'Bundle proposed commits'
        if: always() && steps.packet.outcome == 'success'
        env:
          BRANCH: "${{ steps.packet.outputs.branch }}"
          BASE_SHA: "${{ matrix.base_sha }}"
          REBASE_SHA: "${{ matrix.rebase_sha }}"
          REPOSITORY: "${{ steps.packet.outputs.repository }}"
          ISSUE: "${{ matrix.number }}"
          AGENT_OUTCOME: "${{ steps.agent.outcome }}"
        run: |
          # shellcheck disable=SC2016  # jq variables, not shell expansions
          if [ ! -s artefacts/manifest.json ]; then
            jq -n --arg repo "$REPOSITORY" --argjson issue "$ISSUE" \
              --arg base "$BASE_SHA" --arg branch "$BRANCH" \
              --arg outcome "$AGENT_OUTCOME" '{
                schema: 1, outcome: "author-failed",
                repository: $repo, issue: $issue, base_sha: $base,
                branch: $branch,
                reason: ("the agent session ended with outcome " + $outcome
                         + " and left no manifest")
              }' > artefacts/manifest.json
          fi
          # The manifest is agent output; print a known value or a
          # marker, never its raw text, from a job that writes logs
          # workflow commands are parsed from.
          case "$(jq -r '.outcome // ""' artefacts/manifest.json)" in
            proposed) outcome=proposed ;;
            abstain) outcome=abstain ;;
            author-failed) outcome=author-failed ;;
            *) outcome=unrecognised ;;
          esac
          if [ "$outcome" = proposed ]; then
            # A revision may sit on either recorded base; the manifest
            # says which, and nothing but those two values reaches the
            # command line.
            case "$(jq -r '.base_sha // ""' artefacts/manifest.json)" in
              "$BASE_SHA" | "$REBASE_SHA") base="$(jq -r .base_sha \
                artefacts/manifest.json)" ;;
              *) echo "::warning::manifest base_sha is neither recorded base"
                 base="$BASE_SHA" ;;
            esac
            ref="refs/heads/$BRANCH"
            if git -C workspace rev-parse --verify -q "$ref" > /dev/null; then
              git -C workspace bundle create "$(pwd)/artefacts/changes.bundle" \
                "$base..$ref"
            else
              echo "::warning::manifest says proposed but $ref is absent"
            fi
          fi
          echo "Manifest outcome: $outcome"

      - name: 'Publish proposal'
        id: proposal
        if: always() && steps.packet.outcome == 'success'
        # yamllint disable-line rule:line-length
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          # yamllint disable-line rule:line-length
          name: "monkey-proposal-${{ needs.select.outputs.namespace }}-${{ matrix.key }}"
          path: |
            artefacts/manifest.json
            artefacts/changes.bundle
            artefacts/usage.json
          retention-days: 7
          # One name per issue across attempts, so the publisher always
          # finds it; a rerun of this entry replaces its own earlier
          # proposal instead of colliding with it.
          overwrite: true
          if-no-files-found: 'error'

      - name: 'Preserve session output'
        if: always()
        # yamllint disable-line rule:line-length
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          # yamllint disable-line rule:line-length
          name: "monkey-session-${{ needs.select.outputs.namespace }}-${{ matrix.key }}-${{ github.run_attempt }}"
          path: |
            artefacts/session-summary.md
            artefacts/prompt.md
            artefacts/copilot-logs/
          retention-days: 7
          if-no-files-found: 'warn'

      # Hygiene, not secure erasure (docs/DESIGN.md section 3):
      # plain deletion of the CLI's spilled tool output, its home and
      # the checkout, on a single-use VM. continue-on-error because
      # cleanup must never gate the publish path.
      - name: 'Clear session scratch files'
        if: always()
        continue-on-error: true
        env:
          COPILOT_HOME: "${{ runner.temp }}/copilot"
        run: |
          scratch="${TMPDIR:-/tmp}"
          found=$(find "$scratch" -maxdepth 1 -type f \
            -name '*-copilot-tool-output-*' -print -delete)
          removed=0
          if [ -n "$found" ]; then
            removed=$(printf '%s\n' "$found" | wc -l | tr -d '[:space:]')
          fi
          rm -rf "$COPILOT_HOME" workspace
          echo "Cleared $removed spilled tool-output file(s), the CLI home" \
            "and the checkout."

  publish:
    name: 'Publish (${{ matrix.key }})'
    needs: [select, author]
    # Runs after every author entry, including failed ones, so each
    # issue gets a verdict; never after cancellation or a failed
    # selection.
    if: >-
      !cancelled() && needs.select.result == 'success' &&
      needs.select.outputs.run_agent == 'true'
    runs-on: 'ubuntu-latest'
    # Twenty minutes for the publish itself, plus the Copilot review
    # wait and the read reserve copilot_review.py keeps for it.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.select.outputs.matrix) }}
    permissions:
      actions: read  # Locate the author artifact for this matrix key
      contents: read  # Checkout trusted publisher; fetch public base commit
    steps:
      - name: 'Load egress allow-list'
        if: inputs.egress_policy == 'block'
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/harden-runner-block-action@51ef68401547a8b648275129b9a21544612596d5 # v0.13.1
        with:
          config: "${{ inputs.egress_allow_config }}"
          allow_list_summary: 'false'

      - name: 'Harden runner'
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: "${{ inputs.egress_policy }}"
          allowed-endpoints: "${{ env.CONNECTION_ALLOW_LIST }}"

      - name: 'Require trusted provenance'
        env:
          ASSETS_SHA: "${{ needs.select.outputs.assets_sha }}"
          EVIDENCE_ID: "${{ needs.select.outputs.evidence_id }}"
          SELECTION_SHA: "${{ needs.select.outputs.selection_sha256 }}"
          GUIDANCE_SHA: "${{ needs.select.outputs.guidance_sha256 }}"
          KEY: "${{ matrix.key }}"
          TASK: "${{ matrix.task }}"
          HEAD_SHA: "${{ matrix.head_sha }}"
        run: |
          [[ "$ASSETS_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$EVIDENCE_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$SELECTION_SHA" =~ ^[0-9a-f]{64}$ ]]
          [[ "$GUIDANCE_SHA" =~ ^[0-9a-f]{64}$ ]]
          [[ "$KEY" =~ ^[A-Za-z0-9_.-]+$ ]]
          [[ "$TASK" =~ ^(issue|revise)$ ]]
          [[ "$HEAD_SHA" =~ ^([0-9a-f]{40})?$ ]]

      - name: 'Checkout trusted publisher'
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: "${{ inputs.assets_repository }}"
          ref: "${{ needs.select.outputs.assets_sha }}"
          path: 'monkey-assets'
          persist-credentials: false

      - name: 'Fetch selection evidence'
        # yamllint disable-line rule:line-length
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: "${{ needs.select.outputs.evidence_id }}"
          merge-multiple: true
          path: 'evidence'

      - name: 'Verify evidence bytes'
        id: verified
        env:
          SELECTION_SHA: "${{ needs.select.outputs.selection_sha256 }}"
          GUIDANCE_SHA: "${{ needs.select.outputs.guidance_sha256 }}"
        run: |
          python3 monkey-assets/scripts/bot_evidence.py verify \
            --directory evidence --expect "selection.json=$SELECTION_SHA" \
            --expect "agents.md=$GUIDANCE_SHA"

      # The proposal is untrusted whatever its name, and its archive is
      # never extracted blindly: proposal_fetch.py bounds the zip size,
      # entry count and each file before writing anything
      # (docs/DESIGN.md section 8). A missing or refused artifact still
      # yields a typed manifest, so the check, result, comment and
      # report rows all happen for this issue.
      - name: 'Fetch and accept bounded proposal'
        id: fetch
        env:
          GH_TOKEN: "${{ github.token }}"
          REPOSITORY: "${{ github.repository }}"
          RUN_ID: "${{ github.run_id }}"
          # yamllint disable-line rule:line-length
          NAME: "monkey-proposal-${{ needs.select.outputs.namespace }}-${{ matrix.key }}"
          TARGET: "${{ matrix.repository }}"
          ISSUE: "${{ matrix.number }}"
          BASE_SHA: "${{ matrix.base_sha }}"
          BRANCH: "${{ matrix.branch }}"
        run: |
          # shellcheck disable=SC2016  # jq variables, not shell expansions
          status=0
          python3 monkey-assets/scripts/proposal_fetch.py \
            --repository "$REPOSITORY" --run-id "$RUN_ID" --name "$NAME" \
            --output accepted >> "$GITHUB_OUTPUT" || status=$?
          case "$status" in
            0) exit 0 ;;
            3) reason='the author job produced no proposal artifact' ;;
            4) reason='the proposal artifact failed bounded acceptance' ;;
            *) exit "$status" ;;
          esac
          rm -rf accepted
          mkdir -p accepted
          jq -n --arg repo "$TARGET" --argjson issue "$ISSUE" \
            --arg base "$BASE_SHA" --arg branch "$BRANCH" \
            --arg reason "$reason" '{
              schema: 1, outcome: "author-failed",
              repository: $repo, issue: $issue, base_sha: $base,
              branch: $branch, reason: $reason
            }' > accepted/manifest.json

      - name: 'Check proposal offline'
        id: check
        env:
          KEY: "${{ matrix.key }}"
          # yamllint disable-line rule:line-length
          RUN_URL: "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        run: |
          python3 monkey-assets/scripts/publish.py check \
            --selection evidence/selection.json --key "$KEY" \
            --proposal-dir accepted --workdir work \
            --coauthors monkey-assets/config/coauthors.json \
            --output artefacts/check.json \
            --summary artefacts/check-summary.md \
            --run-url "$RUN_URL"
          cat artefacts/check-summary.md >> "$GITHUB_STEP_SUMMARY"
          echo "verdict=$(jq -r .verdict artefacts/check.json)" \
            >> "$GITHUB_OUTPUT"

      # The bot branch lives in a fork held by a bot organisation, never
      # in the target (docs/DESIGN.md 4.3). The matrix names the fork
      # organisation; this step proves it is one of the bot pools and
      # that the committed mapping still agrees before any token names
      # it as owner.
      - name: 'Resolve fork organisation'
        id: fork
        env:
          ORG: "${{ inputs.org }}"
          FORK_ORG: "${{ matrix.fork_org }}"
        run: |
          if [[ ! "$FORK_ORG" =~ ^lfreleng-bot-forks(-[a-z0-9]+)?$ ]]; then
            echo "::error::$FORK_ORG is not a bot fork organisation"
            exit 1
          fi
          if [ "$FORK_ORG" = "$ORG" ]; then
            echo '::error::The fork organisation cannot be the target'
            exit 1
          fi
          python3 monkey-assets/scripts/fork_orgs.py check \
            --config monkey-assets/config/fork-orgs.json
          resolved="$(python3 monkey-assets/scripts/fork_orgs.py resolve \
            --config monkey-assets/config/fork-orgs.json --owner "$ORG")"
          if [ "$resolved" != "fork_org=$FORK_ORG" ]; then
            echo "::error::Selection named $FORK_ORG; mapping says $resolved"
            exit 1
          fi
          echo "$resolved" >> "$GITHUB_OUTPUT"

      # Forks are public, so the native token can see whether one
      # exists; the answer picks which of the two fork mints runs.
      - name: 'Check fork exists'
        id: fork-state
        env:
          GH_TOKEN: "${{ github.token }}"
          FORK: "${{ matrix.fork_org }}/${{ matrix.repo_name }}"
        run: |
          set +e
          output="$(gh api "repos/$FORK" 2>&1)"
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo 'exists=true' >> "$GITHUB_OUTPUT"
          elif grep -q 'HTTP 404' <<< "$output"; then
            echo 'exists=false' >> "$GITHUB_OUTPUT"
          else
            echo "::error::Could not read $FORK: $output"
            exit 1
          fi

      # Two mints, one per fork state, because a token scoped to a
      # repository that does not exist yet cannot be minted. The
      # creation token is the sole holder of administration, and it
      # runs only when there is no fork to administer. Both always
      # grant workflows: syncing the fork fast-forwards over whatever
      # upstream merged, workflow changes included, whether or not the
      # proposal edits one. Fork organisations hold bot forks alone and
      # have Actions disabled, so the grant runs nothing there.
      - name: 'Mint fork write token'
        id: fork-token
        if: >-
          !inputs.dry_run && steps.check.outputs.verdict == 'proposed' &&
          inputs.github_app_client_id != '' &&
          steps.fork-state.outputs.exists == 'true'
        # yamllint disable-line rule:line-length
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: "${{ inputs.github_app_client_id }}"
          private-key: "${{ secrets.github_app_private_key }}"
          owner: "${{ matrix.fork_org }}"
          # The bare name, relative to owner: independent of how the
          # action parses an owner/repository form.
          repositories: "${{ matrix.repo_name }}"
          permission-contents: 'write'
          permission-metadata: 'read'
          permission-workflows: 'write'

      - name: 'Mint fork creation token'
        id: fork-create-token
        if: >-
          !inputs.dry_run && steps.check.outputs.verdict == 'proposed' &&
          inputs.github_app_client_id != '' &&
          steps.fork-state.outputs.exists == 'false'
        # yamllint disable-line rule:line-length
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: "${{ inputs.github_app_client_id }}"
          private-key: "${{ secrets.github_app_private_key }}"
          # yamllint disable-line rule:line-length
          owner: "${{ matrix.fork_org }}"  # zizmor: ignore[github-app] no repository exists yet to scope to; the fork pool holds only bot forks
          permission-administration: 'write'
          permission-contents: 'write'
          permission-metadata: 'read'
          permission-workflows: 'write'

      # Every write token is checked against the configured App before
      # it is used; a key for another App fails here rather than acts.
      - name: 'Pre-flight: fork token identity'
        if: >-
          steps.fork-token.outcome == 'success' ||
          steps.fork-create-token.outcome == 'success'
        env:
          # yamllint disable-line rule:line-length
          MINTED_SLUG: "${{ steps.fork-token.outputs.app-slug || steps.fork-create-token.outputs.app-slug }}"
        run: |
          python3 monkey-assets/scripts/preflight.py identity \
            --config monkey-assets/config/bot.json --minted-slug "$MINTED_SLUG"

      - name: 'Push branch to fork'
        id: push
        env:
          # yamllint disable-line rule:line-length
          GH_TOKEN: "${{ steps.fork-token.outputs.token || steps.fork-create-token.outputs.token }}"
          MODE: "${{ inputs.mode }}"
          DRY_RUN: "${{ inputs.dry_run }}"
          RUN_ATTEMPT: "${{ github.run_attempt }}"
          # Empty when no proposal arrived; that session cost nothing
          # the report can see.
          AUTHOR_SESSION: "${{ steps.fetch.outputs.artifact_id }}"
        run: |
          extra=()
          if [ "$DRY_RUN" = true ]; then extra+=(--dry-run); fi
          python3 monkey-assets/scripts/publish.py push \
            --check artefacts/check.json --workdir work \
            --run-attempt "$RUN_ATTEMPT" \
            --author-session "$AUTHOR_SESSION" \
            --mode "$MODE" --output artefacts/result.json "${extra[@]}"

      # The pull request is the one write to the target: a token for
      # the target that can touch pull requests and nothing else.
      - name: 'Mint pull request token'
        id: pr-token
        if: >-
          !cancelled() && steps.push.outcome == 'success' &&
          !inputs.dry_run && inputs.mode == 'pull-requests' &&
          inputs.github_app_client_id != ''
        # yamllint disable-line rule:line-length
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: "${{ inputs.github_app_client_id }}"
          private-key: "${{ secrets.github_app_private_key }}"
          owner: "${{ inputs.org }}"
          repositories: "${{ matrix.repo_name }}"
          permission-pull-requests: 'write'
          permission-metadata: 'read'

      - name: 'Pre-flight: pull request token identity'
        if: steps.pr-token.outcome == 'success'
        env:
          MINTED_SLUG: "${{ steps.pr-token.outputs.app-slug }}"
        run: |
          python3 monkey-assets/scripts/preflight.py identity \
            --config monkey-assets/config/bot.json --minted-slug "$MINTED_SLUG"

      - name: 'Open pull request'
        id: open
        if: >-
          !cancelled() && steps.push.outcome == 'success' &&
          !inputs.dry_run && inputs.mode == 'pull-requests' &&
          inputs.github_app_client_id != ''
        env:
          GH_TOKEN: "${{ steps.pr-token.outputs.token }}"
        run: |
          python3 monkey-assets/scripts/publish.py open \
            --result artefacts/result.json --check artefacts/check.json \
            --output artefacts/result.json

      # A revision's pull request already exists; open above did
      # nothing. Answer each review thread with the agent's reply,
      # resolve the ones it marked fixed, and replace the description,
      # all writes to the target's pull requests and nothing else
      # (docs/DESIGN.md section 20).
      - name: 'Respond to review threads'
        id: respond
        if: >-
          !cancelled() && matrix.task == 'revise' &&
          steps.push.outcome == 'success' &&
          !inputs.dry_run && inputs.mode == 'pull-requests' &&
          inputs.github_app_client_id != ''
        env:
          GH_TOKEN: "${{ steps.pr-token.outputs.token }}"
        run: |
          python3 monkey-assets/scripts/publish.py respond \
            --result artefacts/result.json --check artefacts/check.json \
            --output artefacts/result.json

      # GitHub starts no review by itself for a pull request an App
      # opens (docs/DESIGN.md section 8), so the publisher asks, with
      # the one token that may write to the target's pull requests.
      # Best effort: a refusal is a warning in the result, and the wait
      # below still runs in case a review starts another way.
      - name: 'Request Copilot review'
        id: review-request
        if: >-
          !cancelled() && steps.open.outcome == 'success' &&
          inputs.request_review
        env:
          GH_TOKEN: "${{ steps.pr-token.outputs.token }}"
        run: |
          python3 monkey-assets/scripts/publish.py review-request \
            --result artefacts/result.json --output artefacts/result.json

      # The target is public, so reading its reviews and review threads
      # needs no App token. The wait is bounded inside the script, with
      # a reserve for the reads a hit needs, and ends as pending, never
      # clean, when no review of the published head arrives.
      - name: 'Await Copilot review'
        id: review
        if: >-
          !cancelled() && steps.open.outcome == 'success' &&
          inputs.request_review
        env:
          GH_TOKEN: "${{ github.token }}"
        run: |
          python3 monkey-assets/scripts/publish.py review-await \
            --result artefacts/result.json --output artefacts/result.json \
            --wait-minutes 30

      # Runs after a failed push or open as well, so a publish failure
      # and its rollback reach the issue; never after cancellation.
      - name: 'Mint issue comment token'
        id: comment-token
        # yamllint disable-line rule:line-length
        if: ${{ !cancelled() && steps.push.outcome != 'skipped' && !inputs.dry_run && inputs.github_app_client_id != '' }}
        # yamllint disable-line rule:line-length
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: "${{ inputs.github_app_client_id }}"
          private-key: "${{ secrets.github_app_private_key }}"
          owner: "${{ inputs.org }}"
          # The bare name, relative to owner: independent of how the
          # action parses an owner/repository form.
          repositories: "${{ matrix.repo_name }}"
          permission-issues: 'write'
          permission-metadata: 'read'

      - name: 'Comment on the issue'
        # yamllint disable-line rule:line-length
        if: ${{ !cancelled() && steps.push.outcome != 'skipped' && !inputs.dry_run && inputs.github_app_client_id != '' }}
        env:
          GH_TOKEN: "${{ steps.comment-token.outputs.token }}"
          # yamllint disable-line rule:line-length
          RUN_URL: "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          # Stable across attempts: a retry, or a full rerun, searches
          # every comment this run can have posted.
          SINCE: "${{ needs.select.outputs.run_created_at }}"
        run: |
          python3 monkey-assets/scripts/publish.py comment \
            --result artefacts/result.json --run-url "$RUN_URL" \
            --since "$SINCE"

      # Every selected issue gets a row in the report. When an earlier
      # step failed before push wrote a result (the offline check, a
      # token mint), record that as a typed publish failure. A result
      # push wrote is not proof of publication either: in pull-requests
      # mode a proposed verdict with no pull request after open failed
      # or never ran is a publish failure, and the fork branch stays
      # for the next run to resume.
      - name: 'Ensure a result exists'
        if: always()
        env:
          KEY: "${{ matrix.key }}"
          REPOSITORY: "${{ matrix.repository }}"
          FORK_REPOSITORY: "${{ matrix.fork_repository }}"
          ISSUE: "${{ matrix.number }}"
          DRY_RUN: "${{ inputs.dry_run }}"
          MODE: "${{ inputs.mode }}"
          RUN_ATTEMPT: "${{ github.run_attempt }}"
          CHECK_OUTCOME: "${{ steps.check.outcome }}"
          PUSH_OUTCOME: "${{ steps.push.outcome }}"
          OPEN_OUTCOME: "${{ steps.open.outcome }}"
          # The session this entry paid for, and what the check recorded
          # of its spend, survive a later failure so the report counts it.
          AUTHOR_SESSION: "${{ steps.fetch.outputs.artifact_id }}"
        run: |
          # shellcheck disable=SC2016  # jq variables, not shell expansions
          if [ -s artefacts/result.json ]; then
            if [ "$MODE" = pull-requests ] && [ "$DRY_RUN" != true ] &&
              [ "$OPEN_OUTCOME" != success ] &&
              [ "$(jq -r '.verdict' artefacts/result.json)" = proposed ] &&
              [ -z "$(jq -r '.pull_request_url // ""' artefacts/result.json)" ]
            then
              jq --arg outcome "$OPEN_OUTCOME" '
                .verdict = "publish-failed"
                | .reasons += ["branch pushed to the fork but no pull request"
                    + " opened (open: " + $outcome + "); next run resumes"]
              ' artefacts/result.json > artefacts/result.tmp
              mv artefacts/result.tmp artefacts/result.json
            fi
            exit 0
          fi
          mkdir -p artefacts
          usage='{}'
          if [ -s artefacts/check.json ]; then
            usage="$(jq -c '{premium_requests, agent_seconds}' \
              artefacts/check.json)" || usage='{}'
          fi
          reason="publish did not complete (offline check: $CHECK_OUTCOME,"
          reason="$reason push: $PUSH_OUTCOME, open: $OPEN_OUTCOME)"
          jq -n --arg key "$KEY" --arg repo "$REPOSITORY" \
            --arg fork "$FORK_REPOSITORY" \
            --argjson issue "$ISSUE" --arg reason "$reason" \
            --argjson dry "$DRY_RUN" --arg mode "$MODE" \
            --argjson attempt "$RUN_ATTEMPT" \
            --arg session "$AUTHOR_SESSION" --argjson usage "$usage" '
            def number: if type == "number" then . else null end;
            {
              schema: 1, key: $key, repository: $repo,
              fork_repository: $fork, issue: $issue,
              verdict: "publish-failed", reasons: [$reason], warnings: [],
              dry_run: $dry, mode: $mode, run_attempt: $attempt,
              author_session: (if $session == "" then null else $session end),
              branch_url: null, commits: [], pull_request_url: null,
              comment_url: null, pr_title: null,
              premium_requests: ($usage.premium_requests | number),
              agent_seconds: ($usage.agent_seconds | number)
            }' > artefacts/result.json

      - name: 'Attach publish result'
        if: always()
        # yamllint disable-line rule:line-length
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          # yamllint disable-line rule:line-length
          name: "monkey-result-${{ needs.select.outputs.namespace }}-${{ matrix.key }}-${{ github.run_attempt }}"
          path: |
            artefacts/check.json
            artefacts/check-summary.md
            artefacts/result.json
          retention-days: 90
          if-no-files-found: 'warn'

  report:
    name: 'Report'
    needs: [select, author, publish]
    if: ${{ !cancelled() && needs.select.result == 'success' }}
    runs-on: 'ubuntu-latest'
    timeout-minutes: 10
    permissions:
      actions: read  # Gather per-issue result artifacts
      contents: read  # Checkout the report script
    steps:
      - name: 'Load egress allow-list'
        if: inputs.egress_policy == 'block'
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/harden-runner-block-action@51ef68401547a8b648275129b9a21544612596d5 # v0.13.1
        with:
          config: "${{ inputs.egress_allow_config }}"
          allow_list_summary: 'false'

      - name: 'Harden runner'
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: "${{ inputs.egress_policy }}"
          allowed-endpoints: "${{ env.CONNECTION_ALLOW_LIST }}"

      - name: 'Checkout report script'
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: "${{ inputs.assets_repository }}"
          ref: "${{ needs.select.outputs.assets_sha }}"
          path: 'monkey-assets'
          persist-credentials: false

      - name: 'Gather results'
        if: needs.select.outputs.run_agent == 'true'
        # yamllint disable-line rule:line-length
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: "monkey-result-${{ needs.select.outputs.namespace }}-*"
          path: 'results'

      - name: 'Build report'
        env:
          AUTHOR_RESULT: "${{ needs.author.result }}"
          PUBLISH_RESULT: "${{ needs.publish.result }}"
        run: |
          mkdir -p results artefacts
          python3 monkey-assets/scripts/publish.py report \
            --results results --output-md artefacts/report.md \
            --output-json artefacts/report.json
          cat artefacts/report.md >> "$GITHUB_STEP_SUMMARY"
          printf '\nAuthor job: %s; publish job: %s\n' \
            "$AUTHOR_RESULT" "$PUBLISH_RESULT" >> "$GITHUB_STEP_SUMMARY"

      - name: 'Attach run report'
        # yamllint disable-line rule:line-length
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          # yamllint disable-line rule:line-length
          name: "code-monkey-${{ needs.select.outputs.namespace }}-${{ github.run_attempt }}"
          path: 'artefacts/'
          retention-days: 90
          if-no-files-found: 'warn'
