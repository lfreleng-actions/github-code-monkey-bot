---
# SPDX-License-Identifier: Apache-2.0
# SPDX-FileCopyrightText: 2026 The Linux Foundation

name: 'Testing 🧪'

# yamllint disable-line rule:truthy
on:
  pull_request:
  workflow_dispatch:
    inputs:
      repositories:
        description: 'Repositories for the manual dry-run (commas/spaces)'
        type: string
        default: ''
      issues:
        description: 'Issues for the manual dry-run instead of a scan'
        type: string
        default: ''
      max_pull_requests:
        description: 'Pull requests to attempt in the manual dry-run'
        type: string
        default: '1'

permissions: {}

# A newer push cancels its pull request's stale run. Each manual
# dispatch takes a group of its own, so it neither cancels nor is
# cancelled by pull request runs or another dispatch on the same ref.
concurrency:
  group: >-
    ${{ format('testing-{0}', github.event_name == 'pull_request'
    && github.ref || github.run_id) }}
  cancel-in-progress: true

jobs:
  # Exercises the select job and the matrix plumbing without an App,
  # a model token or an agent session. Two invocations prove that the
  # invocation namespace keeps artifact names apart in one run.
  plumbing:
    name: 'Plumbing (secretless, ${{ matrix.invocation }})'
    strategy:
      matrix:
        invocation: [first, second]
    if: github.event_name == 'pull_request'
    permissions:
      issues: read  # Candidate scan
      contents: read  # Asset checkout and public repository reads
      actions: read  # Report job artifact lookup
    uses: $/.github/workflows/code-monkey.yaml
    with:
      org: "${{ github.repository_owner }}"
      mode: 'select'
      dry_run: true
      max_pull_requests: '3'
      # Block mode with the organisation allow-list, as the scheduled
      # caller runs, so a pull request proves the trusted jobs' egress.
      egress_policy: 'block'
      # yamllint disable-line rule:line-length
      egress_allow_config: '@ac32415b91e0b6db1166bc451024c472cdbcbd3d'  # v0.16.8
      assets_repository: >-
        ${{ github.event.pull_request.head.repo.full_name }}
      assets_ref: "${{ github.event.pull_request.head.sha }}"

  # A full dry-run: the agent works the selected issues and the
  # publisher verifies the result without writing anything.
  dry-run:
    name: 'Agent dry-run (manual)'
    if: github.event_name == 'workflow_dispatch'
    permissions:
      issues: read  # Candidate scan
      contents: read  # Asset checkout and public repository reads
      actions: read  # Publish and report jobs locate artifacts
    uses: $/.github/workflows/code-monkey.yaml
    with:
      org: "${{ github.repository_owner }}"
      mode: 'pull-requests'
      dry_run: true
      model: 'claude-sonnet-5.5'
      max_pull_requests: "${{ inputs.max_pull_requests || '1' }}"
      max_runtime_minutes: '60'
      max_concurrent_agents: '2'
      repositories: "${{ inputs.repositories || '' }}"
      issues: "${{ inputs.issues || '' }}"
      egress_policy: 'block'
      # yamllint disable-line rule:line-length
      egress_allow_config: '@ac32415b91e0b6db1166bc451024c472cdbcbd3d'  # v0.16.8
      assets_repository: "${{ github.repository }}"
      assets_ref: "${{ github.sha }}"
    secrets:
      copilot_token: "${{ secrets.COPILOT_CLI_TOKEN }}"

  regression:
    name: 'Offline regression tests'
    runs-on: 'ubuntu-latest'
    timeout-minutes: 10
    permissions:
      contents: read  # Test checked-out code without write credentials
    steps:
      - name: 'Harden runner'
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: 'audit'
      - name: 'Checkout repository'
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 'Install uv'
        # yamllint disable-line rule:line-length
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        # Outside the workspace, as in code-monkey.yaml: setup-uv
        # starts the interpreter it finds in its working directory.
        env:
          UV_NO_CONFIG: '1'
          UV_SYSTEM_PYTHON: '1'
          UV_NO_PROJECT: '1'
        with:
          working-directory: "${{ runner.temp }}"
          enable-cache: false
      - name: 'Run offline regression suite'
        run: uv run --locked python -B -m unittest discover -s tests -v

  # Runs the select job's uv steps exactly as code-monkey.yaml writes
  # them (the contract tests hold the copies equal) with a .venv and a
  # .python-version planted in the workspace root, setup-uv's default
  # working directory, and in the assets checkout, where the pre-flight
  # runs uv, plus a uv.toml in the root. Each planted interpreter
  # appends to a marker as it starts and exits 1, because uv passes
  # over an interpreter that fails without failing the step.
  uv-workdir:
    name: 'uv steps ignore planted Python'
    runs-on: 'ubuntu-latest'
    timeout-minutes: 10
    permissions:
      contents: read  # Check out the assets as the select job does
    steps:
      - name: 'Harden runner'
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: 'audit'
      - name: 'Checkout assets'
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: 'monkey-assets'
          persist-credentials: false
      - name: 'Plant Python and uv settings'
        run: |
          exe() {
            { echo '#!/bin/sh'
              echo "echo \"ran: \$0\" >> '$RUNNER_TEMP/planted-ran'"
              echo 'exit 1'; } > "$1"
            chmod +x "$1"
          }
          plant() {
            mkdir -p "$1/.venv/bin"
            printf 'home = /usr/bin\nversion = 3.12.0\n' > "$1/.venv/pyvenv.cfg"
            exe "$1/.venv/bin/python3"
            exe "$1/.venv/bin/python"
            exe "$1/planted-python"
            echo "$1/planted-python" > "$1/.python-version"
          }
          plant "$GITHUB_WORKSPACE"
          plant "$GITHUB_WORKSPACE/monkey-assets"
          printf '%s\n' 'cache-dir = "/nonexistent/planted-cache"' \
            'required-version = "==0.0.1"' > "$GITHUB_WORKSPACE/uv.toml"
      - name: 'Set up uv'
        id: setup-uv
        # yamllint disable-line rule:line-length
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        env:
          UV_NO_CONFIG: '1'
          UV_SYSTEM_PYTHON: '1'
          UV_NO_PROJECT: '1'
        with:
          working-directory: "${{ runner.temp }}"
          enable-cache: false
      - name: 'Install zizmor'
        run: uv tool install 'zizmor==1.30.1'
      - name: 'Pre-flight: workflow contracts and audit'
        run: |
          # uv run reuses an existing project environment, and runs its
          # interpreter, in the assets checkout or a uv workspace above
          # it. Build the environment under RUNNER_TEMP instead, from an
          # interpreter found there.
          py="$(cd "$RUNNER_TEMP" &&
            UV_NO_CONFIG=1 uv python find --system --no-project)"
          if [ -z "$py" ]; then
            echo '::error::No Python interpreter found for the pre-flight'
            exit 1
          fi
          cd monkey-assets
          UV_PROJECT_ENVIRONMENT="$RUNNER_TEMP/preflight-venv" \
            uv run --locked --python "$py" \
            python -B scripts/preflight.py workflow --root .
      - name: 'Check outputs and marker'
        env:
          UV_VERSION: "${{ steps.setup-uv.outputs.uv-version }}"
          PYTHON_VERSION: "${{ steps.setup-uv.outputs.python-version }}"
        run: |
          if [ -e "$RUNNER_TEMP/planted-ran" ]; then
            echo '::error::A planted interpreter ran:'
            cat "$RUNNER_TEMP/planted-ran"
            exit 1
          fi
          installed="$(uv --version | cut -d' ' -f2)"
          if ! [[ "$UV_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] ||
            [ "$UV_VERSION" = 0.0.1 ] || [ "$installed" != "$UV_VERSION" ]; then
            echo "::error::uv-version '$UV_VERSION', uv on PATH '$installed'"
            exit 1
          fi
          [[ "$PYTHON_VERSION" =~ ^3\.[0-9]+\.[0-9]+$ ]] || {
            echo "::error::python-version output is '$PYTHON_VERSION'"
            exit 1; }
          [ "${UV_CACHE_DIR:-}" != /nonexistent/planted-cache ] || {
            echo '::error::UV_CACHE_DIR came from the planted uv.toml'
            exit 1; }
          "$RUNNER_TEMP/preflight-venv/bin/python" --version
          echo "uv $UV_VERSION, Python $PYTHON_VERSION, no planted file used"

  docs:
    name: 'Documentation build'
    if: github.event_name == 'pull_request'
    runs-on: 'ubuntu-latest'
    permissions:
      contents: read  # Check out the documentation sources
    timeout-minutes: 10
    steps:
      - name: 'Harden runner'
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43  # v2.22.3
        with:
          egress-policy: 'audit'

      - name: 'Checkout repository'
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: 'Install uv'
        # yamllint disable-line rule:line-length
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        # Outside the workspace, as in code-monkey.yaml: setup-uv
        # starts the interpreter it finds in its working directory.
        env:
          UV_NO_CONFIG: '1'
          UV_SYSTEM_PYTHON: '1'
          UV_NO_PROJECT: '1'
        with:
          working-directory: "${{ runner.temp }}"
          enable-cache: false

      # Proves the site builds from the pull request head without
      # granting it any Pages permission; the deployment lives in
      # documentation.yaml and runs from the default branch alone.
      - name: 'Build documentation'
        shell: bash
        run: |
          uv venv --python 3.13
          uv pip install --require-hashes \
            --requirement docs/requirements.txt
          .venv/bin/mkdocs build --strict
