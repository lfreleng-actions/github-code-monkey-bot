---
# SPDX-License-Identifier: Apache-2.0
# SPDX-FileCopyrightText: 2026 The Linux Foundation

# Builds the MkDocs site from docs/ and publishes it to GitHub Pages
# using the Actions deployment model (configure-pages +
# upload-pages-artifact + deploy-pages).
#
# IMPORTANT: in the repository settings under "Pages > Build and
# deployment", the "Source" must read "GitHub Actions" before the
# first deployment succeeds.
name: 'Documentation 📚'

# Runs when the published content changes on the default branch, and
# on manual dispatch for a republish. Pull requests build the site in
# the testing workflow instead, which proves the build without
# granting a pull request head any Pages permission.
#
# A dispatch can select any ref, so the deploy job below refuses to
# publish anything but the default branch; dispatching another ref
# builds the site and stops there.
# yamllint disable-line rule:truthy
on:
  push:
    branches:
      - 'main'
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - '.github/workflows/documentation.yaml'
  workflow_dispatch:

permissions: {}

# Serialise every deployment: they all publish to the same site, and
# an out-of-order completion would republish stale content. Queue
# rather than cancel, per the actions/deploy-pages guidance.
concurrency:
  group: 'github-pages'
  cancel-in-progress: false

jobs:
  build:
    name: 'Build site'
    runs-on: 'ubuntu-latest'
    permissions:
      contents: read  # Check out the documentation sources
    timeout-minutes: 10
    steps:
      - name: 'Harden runner'
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a  # v2.22.4
        with:
          egress-policy: 'audit'

      - name: 'Checkout repository'
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # Guarded as in code-monkey.yaml, which says why: setup-uv works
      # outside the workspace with its interpreter lookup disabled, and
      # uv runs only the Python 'Install Python' installs.
      - name: 'Set up uv'
        id: setup-uv
        # yamllint disable-line rule:line-length
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          working-directory: "${{ runner.temp }}"
          tool-bin-dir: "${{ runner.temp }}/uv-tool-bin"
          # No caching on a publishing path: a restored cache that a
          # lower-privileged run could populate buys little here and
          # widens the supply chain for the deployed artefact. Its
          # post-step 'uv cache prune' would also hit the invalid
          # preference below.
          enable-cache: false
        env:
          UV_NO_CONFIG: '1'
          UV_NO_PROJECT: '1'
          # setup-uv's only uv call here is "uv python find", whose
          # result it executes; an invalid preference makes uv refuse
          # its arguments before any lookup.
          UV_PYTHON_PREFERENCE: 'lookup-disabled'
          # Inherited, it makes setup-uv probe uv, which the line above
          # fails.
          UV_PYTHON_ARCH: ''
          # setup-uv puts this directory on PATH ahead of its own uv
          # before its bare 'uv python find', so an inherited one could
          # hold the uv that runs. It is the one 'Install Python' fills.
          UV_PYTHON_INSTALL_DIR: "${{ runner.temp }}/uv-python"

      - name: 'Install Python'
        id: python
        shell: bash
        # uv starts a .venv interpreter in its working directory to
        # inspect it, even under env -i.
        working-directory: "${{ runner.temp }}"
        env:
          UV: "${{ steps.setup-uv.outputs.uv-path }}"
          INSTALL_DIR: "${{ runner.temp }}/uv-python"
        run: |
          clean=(UV_NO_CONFIG=1 UV_NO_PROJECT=1
            "UV_PYTHON_INSTALL_DIR=$INSTALL_DIR"
            "UV_CACHE_DIR=$RUNNER_TEMP/uv-cache")
          for name in HTTP_PROXY HTTPS_PROXY ALL_PROXY NO_PROXY http_proxy \
              https_proxy all_proxy no_proxy SSL_CERT_FILE SSL_CERT_DIR \
              UV_NATIVE_TLS; do
            if [ -n "${!name+set}" ]; then clean+=("$name=${!name}"); fi
          done
          env -i "${clean[@]}" "$UV" python install --quiet --no-bin 3.13
          # 'python find' starts any .venv interpreter in the working
          # directory or above it; 'python list' reads the install's
          # metadata instead.
          listed=$(env -i "${clean[@]}" "$UV" python list --only-installed \
            --managed-python --output-format json 3.13)
          # The first entry's "path", past its other keys and the
          # objects nested in them.
          first='^\[\{([^{}"]|"[^"]*"|\{[^{}]*\})*"path":"([^"]+)"'
          py=
          if [[ "$listed" =~ $first ]]; then
            py="${BASH_REMATCH[2]}"
          fi
          # uv lists an install below the working directory relative to
          # it, so resolve it there, and refuse '..' before the check.
          case "$py" in
            /*) ;;
            ?*) py="$PWD/$py" ;;
          esac
          case "$py/" in
            */../*) py= ;;
          esac
          case "$py" in
            "$INSTALL_DIR"/*) ;;
            *) echo "::error::uv found Python outside its install directory"
               exit 1 ;;
          esac
          echo "path=$py" >> "$GITHUB_OUTPUT"

      - name: 'Build documentation'
        shell: bash
        # This repository is not a Python package, so the build runs
        # in a throwaway environment holding the documentation
        # requirements and nothing else. --require-hashes refuses
        # anything outside the compiled lock, so the deployed site
        # comes from one reviewed dependency tree; --strict promotes
        # MkDocs warnings (broken links, orphaned pages) to failures.
        env:
          UV: "${{ steps.setup-uv.outputs.uv-path }}"
          PYTHON: "${{ steps.python.outputs.path }}"
        run: |
          venv="$RUNNER_TEMP/docs-venv"
          "$UV" venv --python "$PYTHON" "$venv"
          "$UV" pip install --python "$venv/bin/python" --require-hashes \
            --requirement docs/requirements.txt
          "$venv/bin/python" -I -m mkdocs build --strict

      - name: 'Upload Pages artifact'
        # yamllint disable-line rule:line-length
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with:
          path: 'site'

  deploy:
    name: 'Deploy to GitHub Pages'
    needs: build
    # workflow_dispatch accepts any ref. Publishing one would put
    # unreviewed content on the site, so deployment stays pinned to
    # the default branch and a dispatch elsewhere builds only.
    if: github.ref == 'refs/heads/main'
    runs-on: 'ubuntu-latest'
    permissions:
      pages: write  # Publish the built site to GitHub Pages
      id-token: write  # OIDC token for the Pages deployment
    environment:
      name: 'github-pages'
      url: ${{ steps.deployment.outputs.page_url }}
    timeout-minutes: 10
    steps:
      - name: 'Harden runner'
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a  # v2.22.4
        with:
          egress-policy: 'audit'

      - name: 'Configure Pages'
        # yamllint disable-line rule:line-length
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d  # v6.0.0

      - name: 'Deploy to GitHub Pages'
        id: deployment
        # yamllint disable-line rule:line-length
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5.0.1

      - name: 'Publish site URL to summary'
        if: always()
        shell: bash
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          {
            echo "## 📚 Documentation published"
            echo ""
            if [ -n "${PAGE_URL}" ]; then
              echo "[${PAGE_URL}](${PAGE_URL})"
            else
              echo "_(deployment did not produce a URL)_"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
